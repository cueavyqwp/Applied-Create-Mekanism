name: Release

on:
  workflow_dispatch:
    inputs:
      comment:
        description: "更新信息: "
        default: "无描述"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
    env:
      VERSION: "0.0.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: src

      - name: Setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Pack
        run: |
          mv ./src/pack.py ./pack.py
          mv ./src/info.py ./info.py
          VERSION=$(python -c "print(__import__('info').version)")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          python pack.py

      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: github.ref_type == 'tag'
        with:
          tag_name: ${{ env.VERSION }}
          generate_release_notes: true
          name: Release v${{ env.VERSION }}
          body: |
            已更新至 `v${{ env.VERSION }}`
            更新说明([完整更新日志](https://github.com/cueavyqwp/Applied-Create-Mekanism/blob/main/CHANGELOG.md)): `${{ inputs.comment }}`
          files: |
            dist/*
