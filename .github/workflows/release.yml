name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "预发布版"
        type: boolean
        default: false
      comment:
        description: "更新信息:"
        default: "无描述"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
    env:
      VERSION: "0.0.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: src

      - name: Setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Pack
        run: |
          cp ./src/pack.py ./pack.py
          cp ./src/info.py ./info.py
          VERSION=$(python -c "print(__import__('info').version)")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          python pack.py

      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          name: Release v${{ env.VERSION }}
          body: |
            已更新至 `v${{ env.VERSION }}`
            完整更新日志见: [CHANGELOG.md](https://github.com/cueavyqwp/Applied-Create-Mekanism/blob/main/CHANGELOG.md)
            更新说明: `${{ inputs.comment }}`
          files: |
            dist/*
