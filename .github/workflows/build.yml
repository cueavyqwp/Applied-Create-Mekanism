name: Build

on:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "defaultconfigs/**"
      - "config/**"
      - "kubejs/**"
      - "modrinth.index.json"
      - "info.py"
      - "pack.py"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DIST: "unnamed.zip"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: src

      - name: Setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Pack
        run: |
          mv ./src/pack.py ./pack.py
          mv ./src/info.py ./info.py
          DIST=$(python -c "print(__import__('info').dist_client)")
          echo "DIST=$DIST" >> $GITHUB_ENV
          python pack.py

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          path: ./dist/${{ env.DIST }}
          archive: false
