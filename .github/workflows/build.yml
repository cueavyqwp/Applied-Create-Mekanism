name: build

on:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "defaultconfigs/**"
      - "config/**"
      - "kubejs/**"
      - "modrinth.index.json"
      - "info.py"
      - "pack.py"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: src

      - name: Setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Pack
        run: |
          mv ./src/pack.py ./pack.py
          mv ./src/info.py ./info.py
          python pack.py
          VERSION=$(python -c "print(__import__('info').version)")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mkdir ./dist
          cd ./output
          zip -r "../dist/Applied Create & Mekanism-$VERSION.zip" ./*

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Applied Create & Mekanism-${{ env.VERSION }}
          path: ./dist/
          archive: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: github.ref_type == 'tag'
        with:
          tag_name: ${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: |
            已更新至 `v${{ env.VERSION }}`
          files: |
            dist/*
